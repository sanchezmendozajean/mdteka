appId: app.mdtor
productName: MDTor
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  # Generado desde specs/design/icono.svg con `npm run icons`.
  icon: build/icon.ico
  # Sin certificado no se firma, pero hace falta para incrustar el icono y los datos del ejecutable.
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
fileAssociations:
  - ext: mdtor
    name: Proyecto MDTor
    description: Proyecto MDTor
    role: Editor
  - ext: md
    name: Documento Markdown
    description: Documento Markdown
    role: Editor
